<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" font-family="ConsolasFallback,Consolas,monospace" width="985px" height="660px" font-size="16px">
<style>
@font-face {
src: local('Consolas'), local('Consolas Bold');
font-family: 'ConsolasFallback';
font-display: swap;
-webkit-size-adjust: 109%;
size-adjust: 109%;
}
.key {fill: #953800;}
.value {fill: #0550ae;}
.addColor {fill: #1a7f37;}
.delColor {fill: #cf222e;}
.cc {fill: #6e7781;}
.prompt {fill: #0969da;}
.sep {fill: #57606a;}
.out {fill: #57606a;}
text, tspan {white-space: pre;}
</style>
<rect width="985px" height="660px" fill="#f6f8fa" rx="15"/>

<!-- terminal title bar -->
<rect x="0" y="0" width="985" height="34" fill="#eaeef2" rx="15"/>
<rect x="0" y="20" width="985" height="14" fill="#eaeef2"/>
<circle cx="20" cy="17" r="6" fill="#ff5f56"/>
<circle cx="42" cy="17" r="6" fill="#ffbd2e"/>
<circle cx="64" cy="17" r="6" fill="#27c93f"/>
<text x="492" y="22" fill="#57606a" font-size="13px" text-anchor="middle">vishwajit@github: ~</text>

<!-- top terminal commands -->
<text x="15" y="64"><tspan class="prompt">vishwajit@github</tspan><tspan class="sep">:</tspan><tspan class="value">~</tspan><tspan class="sep">$ </tspan><tspan fill="#24292f">whoami</tspan></text>
<text x="15" y="86" class="out">Vishwajit Sarnobat — B.Tech Computer Engineering, SPIT Mumbai</text>
<text x="15" y="118"><tspan class="prompt">vishwajit@github</tspan><tspan class="sep">:</tspan><tspan class="value">~</tspan><tspan class="sep">$ </tspan><tspan fill="#24292f">neofetch</tspan></text>

