<style>
@font-face {
src: local('Consolas'), local('Consolas Bold');
font-family: 'ConsolasFallback';
font-display: swap;
-webkit-size-adjust: 109%;
size-adjust: 109%;
}
.key {fill: #953800;}
.value {fill: #0550ae;}
.addColor {fill: #1a7f37;}
.delColor {fill: #cf222e;}
.cc {fill: #6e7781;}
.prompt {fill: #0969da;}
.sep {fill: #57606a;}
.out {fill: #57606a;}
text, tspan {white-space: pre;}
@media (prefers-reduced-motion: no-preference) {
.t {opacity: 0; animation: tline .25s ease forwards;}
.t.cursor {animation: tline .25s ease forwards, blink 1.1s steps(1) infinite;}
@keyframes tline {from {opacity: 0;} to {opacity: 1;}}
@keyframes blink {0%, 49% {opacity: 1;} 50%, 100% {opacity: 0;}}
}
</style>
