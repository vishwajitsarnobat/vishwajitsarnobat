<svg width="900" height="280" viewBox="0 0 900 280" xmlns="http://www.w3.org/2000/svg" font-family="'Fira Code','Consolas',monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e14"/>
      <stop offset="100%" stop-color="#141c2b"/>
    </linearGradient>
    <clipPath id="round">
      <rect x="0" y="0" width="900" height="280" rx="14" ry="14"/>
    </clipPath>
    <clipPath id="avatarClip">
      <rect x="712" y="70" width="164" height="164" rx="8" ry="8"/>
    </clipPath>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#1f2937"/>
    </pattern>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000000" opacity="0.08"/>
    </pattern>
  </defs>

  <g clip-path="url(#round)">
    <rect width="900" height="280" fill="url(#bg)"/>
    <rect width="900" height="280" fill="url(#dots)"/>

    <!-- title bar -->
    <rect x="0" y="0" width="900" height="34" fill="#10151f"/>
    <line x1="0" y1="34" x2="900" y2="34" stroke="#232b3a" stroke-width="1"/>
    <circle cx="20" cy="17" r="6" fill="#ff5f56"/>
    <circle cx="42" cy="17" r="6" fill="#ffbd2e"/>
    <circle cx="64" cy="17" r="6" fill="#27c93f"/>
    <text x="450" y="22" fill="#7d8590" font-size="13" text-anchor="middle">vishwajit@github: ~</text>

    <!-- left: terminal text -->
    <g font-size="16" fill="#c9d1d9">
      <text x="24" y="68"><tspan fill="#2AA9E0">vishwajit@github</tspan><tspan fill="#7d8590">:</tspan><tspan fill="#a5d6ff">~</tspan><tspan fill="#7d8590">$ </tspan><tspan fill="#c9d1d9">whoami</tspan></text>
      <text x="24" y="96" fill="#8b949e">Vishwajit Sarnobat</text>
      <text x="24" y="118" fill="#8b949e">Computer Engineering, SPIT Mumbai</text>

      <text x="24" y="154"><tspan fill="#2AA9E0">vishwajit@github</tspan><tspan fill="#7d8590">:</tspan><tspan fill="#a5d6ff">~</tspan><tspan fill="#7d8590">$ </tspan><tspan fill="#c9d1d9">cat focus.txt</tspan></text>
      <g opacity="0">
        <text x="24" y="182" fill="#8b949e">Federated Learning · RL · Diffusion Models</text>
        <text x="24" y="204" fill="#8b949e">Deepfake Detection · RADAR/Satellite ML</text>
        <animate attributeName="opacity" from="0" to="1" begin="0.6s" dur="0.4s" fill="freeze"/>
      </g>

      <g opacity="0">
        <text x="24" y="240"><tspan fill="#2AA9E0">vishwajit@github</tspan><tspan fill="#7d8590">:</tspan><tspan fill="#a5d6ff">~</tspan><tspan fill="#7d8590">$ </tspan><tspan fill="#c9d1d9">display avatar.png</tspan></text>
        <animate attributeName="opacity" from="0" to="1" begin="1.2s" dur="0.4s" fill="freeze"/>
      </g>

      <rect x="24" y="256" width="10" height="16" fill="#2AA9E0">
        <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.4;0.5;0.9;1" dur="1.1s" begin="1.6s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- right: photo rendered as a nested terminal pane -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="1.8s" dur="0.5s" fill="freeze"/>

      <!-- mini window frame around the photo -->
      <rect x="704" y="46" width="180" height="196" rx="10" ry="10" fill="#0d1117" stroke="#232b3a" stroke-width="1.5"/>
      <rect x="704" y="46" width="180" height="24" rx="10" ry="10" fill="#10151f"/>
      <rect x="704" y="58" width="180" height="12" fill="#10151f"/>
      <circle cx="716" cy="58" r="4" fill="#ff5f56"/>
      <circle cx="730" cy="58" r="4" fill="#ffbd2e"/>
      <circle cx="744" cy="58" r="4" fill="#27c93f"/>
      <text x="884" y="62" fill="#7d8590" font-size="10" text-anchor="end">avatar.png</text>

      <image href="https://avatars.githubusercontent.com/u/128615348?v=4"
             x="712" y="70" width="164" height="164"
             clip-path="url(#avatarClip)" preserveAspectRatio="xMidYMid slice"/>
      <rect x="712" y="70" width="164" height="164" rx="8" ry="8" fill="none" stroke="#2AA9E0" stroke-width="1.5" opacity="0.6"/>
    </g>

    <!-- CRT scanline overlay across the whole card -->
    <rect width="900" height="280" fill="url(#scan)"/>
    <rect width="900" height="280" fill="#2AA9E0" opacity="0.02"/>
  </g>

  <rect x="0.5" y="0.5" width="899" height="279" rx="14" ry="14" fill="none" stroke="#30363d" stroke-width="1"/>
</svg>
