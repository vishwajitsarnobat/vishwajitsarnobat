<svg width="900" height="260" viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg" font-family="'Fira Code','Consolas',monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f1419"/>
      <stop offset="100%" stop-color="#1a2332"/>
    </linearGradient>
    <clipPath id="round">
      <rect x="0" y="0" width="900" height="260" rx="14" ry="14"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="900" height="260" fill="url(#bg)"/>

    <!-- title bar -->
    <rect x="0" y="0" width="900" height="34" fill="#161b22"/>
    <circle cx="20" cy="17" r="6" fill="#ff5f56"/>
    <circle cx="42" cy="17" r="6" fill="#ffbd2e"/>
    <circle cx="64" cy="17" r="6" fill="#27c93f"/>
    <text x="450" y="22" fill="#7d8590" font-size="13" text-anchor="middle">vishwajit@github: ~</text>

    <!-- terminal body -->
    <g font-size="16" fill="#c9d1d9">
      <text x="24" y="66"><tspan fill="#2AA9E0">vishwajit@github</tspan><tspan fill="#7d8590">:</tspan><tspan fill="#a5d6ff">~</tspan><tspan fill="#7d8590">$ </tspan><tspan fill="#c9d1d9">whoami</tspan></text>

      <text x="24" y="94" fill="#8b949e">Vishwajit Sarnobat — Computer Engineering, SPIT Mumbai</text>

      <text x="24" y="128"><tspan fill="#2AA9E0">vishwajit@github</tspan><tspan fill="#7d8590">:</tspan><tspan fill="#a5d6ff">~</tspan><tspan fill="#7d8590">$ </tspan><tspan fill="#c9d1d9">cat focus.txt</tspan></text>

      <g opacity="0">
        <text x="24" y="156" fill="#8b949e">Federated Learning · Reinforcement Learning · Diffusion Models · Deepfake Detection</text>
        <animate attributeName="opacity" from="0" to="1" begin="0.6s" dur="0.4s" fill="freeze"/>
      </g>

      <g opacity="0">
        <text x="24" y="190"><tspan fill="#2AA9E0">vishwajit@github</tspan><tspan fill="#7d8590">:</tspan><tspan fill="#a5d6ff">~</tspan><tspan fill="#7d8590">$ </tspan><tspan fill="#c9d1d9">neofetch --minimal</tspan></text>
        <animate attributeName="opacity" from="0" to="1" begin="1.4s" dur="0.4s" fill="freeze"/>
      </g>

      <g opacity="0">
        <text x="24" y="218" fill="#8b949e">OS: Linux Mint / Fedora   Shell: zsh   Stack: Python · Rust · C++ · PyTorch</text>
        <animate attributeName="opacity" from="0" to="1" begin="2.0s" dur="0.4s" fill="freeze"/>
      </g>
    </g>

    <!-- blinking cursor -->
    <rect x="24" y="234" width="10" height="16" fill="#2AA9E0">
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.4;0.5;0.9;1" dur="1.1s" begin="2.4s" repeatCount="indefinite"/>
    </rect>
  </g>

  <rect x="0.5" y="0.5" width="899" height="259" rx="14" ry="14" fill="none" stroke="#30363d" stroke-width="1"/>
</svg>
